<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" />
  
  <!-- Link Chain Icon -->
  <g fill="white" stroke="white" stroke-width="2">
    <!-- First Link -->
    <circle cx="35" cy="40" r="8" fill="none" stroke-width="3"/>
    <!-- Second Link -->
    <circle cx="65" cy="60" r="8" fill="none" stroke-width="3"/>
    <!-- Connection Line -->
    <line x1="42" y1="47" x2="58" y2="53" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Video Call Icon -->
  <g fill="white" transform="translate(20, 20)">
    <rect x="15" y="25" width="30" height="20" rx="3" fill="none" stroke="white" stroke-width="2"/>
    <polygon points="45,30 52,27 52,43 45,40" fill="white"/>
  </g>
  
  <!-- Message Bubbles -->
  <g fill="white" transform="translate(55, 25)">
    <circle cx="8" cy="8" r="6" fill="white" opacity="0.9"/>
    <circle cx="18" cy="15" r="4" fill="white" opacity="0.7"/>
  </g>
</svg>
